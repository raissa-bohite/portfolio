technical:
  intro: The API was evolving alongside my front end, and the site takes payments. Every choice answers one of these two constraints.
  decisions:
    - title: An always up-to-date catalogue
      text: "The site was first generated once, at deployment: a product added in the back office did not appear. I spotted the problem, explained the solution to the back-end team in a written document, then switched the site to server rendering. Products, prices and stock are now always current."
    - title: Payment confirmed by Stripe
      text: "While reviewing the code, I found that the browser was telling the server an order had been paid. I removed that flow: Stripe now notifies the server directly, and the site waits for that confirmation."
    - title: Prices recalculated by the server
      text: "Prices were sent by the browser, so they could be changed. The fix had to happen on the server: I wrote a document for the back-end team with an example attack and the list of fixes to make."
    - title: A single gateway to the API
      text: "In the back office, every request goes through one apiFetch function, below plain TypeScript services and TanStack Query hooks. When the API renamed a field, I changed one file and no page."
    - title: A demo mode kept out of production
      text: "When the API was down, an environment variable simulated about forty endpoints in memory. This code is loaded dynamically, so it never ships to production, and a badge reminds users the data is fictitious."
    - title: A design system for thirty screens
      text: "Tokens, light and dark themes, and base components organised with Atomic Design. This foundation let me redo the whole visual design in June without rewriting the page logic."
  stack: [Astro, React 19, TypeScript, Vite, TanStack Query, Tailwind CSS 4, React Router 7, Framer Motion, Stripe, Laravel API]
results:
  intro: "The site and the back office are live. The brand manages its catalogue, orders and content on its own."
  metrics:
    - value: 30+
      label: screens in the back office
    - value: "7"
      label: weeks to build the back office
    - value: "~40"
      label: endpoints simulated in demo mode
    - value: "2"
      label: payment flaws found and documented
learnings:
  - "Looking back, I would write tests for the back office. The service layer lends itself well to testing, since it does not depend on React, and their absence is a real gap for a tool that handles payments."
  - "I would also store the session token in an httpOnly cookie rather than in the browser's localStorage, to better protect access to a tool that can refund customers."
