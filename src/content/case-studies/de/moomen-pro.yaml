project: moomen-pro
locale: de
eyebrow: Fallstudie · Kundenprojekt
title: Moomen Pro, eine Website, die Lust auf Anmeldung macht
lead: 'Moomen Pro hilft Händlerinnen und Händlern in Westafrika, Verkäufe und Lagerbestand vom Handy aus zu verwalten. Ich habe die Website neu gestaltet: Vorstellung der App, Preise und ein Shop für Verbrauchsmaterial.'
seoTitle: Moomen Pro, Website-Neugestaltung und Shop · Fallstudie
seoDescription: Neugestaltung der Website von Moomen Pro mit Astro, einer Kassen-App für KMU, mit Preisen pro Land und Bestellung über WhatsApp.
meta:
  role: Frontend-Entwicklerin, UI/UX und API-Integration
  team: Für Moomen Pro (KORANEX)
  period: '2026'
  status: Online
context:
- 'Moomen Pro ist eine Kassen- und Verwaltungs-App für kleine Unternehmen: Verkäufe, Lager, Kundschaft und Belege.'
- Die alte Website wirkte veraltet und weckte wenig Lust, sich anzumelden. Der Kunde wollte eine moderne Website, die die App vorstellt, die Angebote zeigt und Verbrauchsmaterial wie Drucker und Papierrollen verkauft.
role:
  paragraphs:
  - 'Ich habe die Seiten der Website gestaltet und entwickelt und sie dann an zwei bestehende APIs angebunden: Preise und Shop. Außerdem habe ich das Präsentationsvideo per Vibe Motion Design erstellt.'
  highlights:
  - Seitendesign
  - API-Anbindung
  - Bestellung über WhatsApp
  - Präsentationsvideo
approach:
  paragraphs:
  - Die Besucherinnen und Besucher sind meist mobil unterwegs, oft mit langsamer Verbindung. Deshalb habe ich eine leichte Website mit statischen Seiten gebaut, die schnell laden.
  - 'Im Shop öffnet jedes Produkt mit einem Button WhatsApp, das Produkt ist schon angegeben: So bestellt die Kundschaft gewohnt. Die Preise erscheinen in der Landeswährung.'
  gallery:
  - image: ../../../assets/case-studies/moomen/pricing.jpg
    alt: 'Preise: Länderauswahl, drei Monats- oder Jahrestarife in CFA-Franc und ein kostenloser Tarif'
    caption: Preise in der Landeswährung
    frame: desktop
  - image: ../../../assets/case-studies/moomen/sectors.jpg
    alt: 'Abschnitt „Für wen ist Moomen Pro?“: Läden, Handwerk, Supermärkte, Lebensmittelhändler, Gastronomie, Friseure'
    caption: Die Zielbranchen
    frame: desktop
  - image: ../../../assets/case-studies/moomen/shop.jpg
    alt: Shop für Verbrauchsmaterial mit Suche, Kategoriefiltern und Produktkarten
    caption: Shop für Verbrauchsmaterial
    frame: desktop
  - image: ../../../assets/case-studies/moomen/product.jpg
    alt: 'Produktseite: Preis in CFA-Franc, Menge, Button Über WhatsApp bestellen und Lagerinformationen'
    caption: Direkte Bestellung über WhatsApp
    frame: desktop
technical:
  intro: Meine Entscheidungen kamen vor allem aus konkreten Problemen.
  decisions:
  - title: Ein Layout, das nur online kaputt war
    text: 'Auf meinem Rechner sah die Website richtig aus, nach der Veröffentlichung aber nicht: Die Desktop-Version sah aus wie die mobile. Ich habe herausgefunden, dass das Werkzeug zur CSS-Komprimierung einen Teil der Styles entfernte, und es deaktiviert.'
  - title: Den ganzen Katalog anzeigen
    text: Die API lieferte die Produkte seitenweise, die Website zeigte aber nur die erste Seite. Ich habe eine Paginierung ergänzt.
  - title: Der richtige Preis in der richtigen Währung
    text: Ich habe zwei API-Antworten kombiniert, um jedes Angebot in der Landeswährung anzuzeigen.
  - title: Grundlagen von SEO und Barrierefreiheit
    text: Titel und Beschreibung pro Seite, eine Sitemap, ein Link direkt zum Inhalt und Unterstützung der Einstellung für reduzierte Bewegung.
  stack:
  - Astro
  - Tailwind CSS
  - TypeScript
  - REST-API
results:
  intro: Die neue Website ist online. Sie stellt die App vor, zeigt die Angebote in der Währung jedes Landes und ermöglicht die Bestellung von Verbrauchsmaterial über WhatsApp.
  metrics:
  - value: '15'
    label: Seiten mit einheitlichem Design
  - value: '2'
    label: APIs angebunden, Preise und Shop
learnings:
- 'Immer die veröffentlichte Version testen, nicht nur die Entwicklungsversion: Der Layoutfehler existierte erst online.'
- Beim nächsten Mal verfolge ich Anmeldungen und Klicks zu WhatsApp, um zu prüfen, ob die Designentscheidungen funktionieren.
