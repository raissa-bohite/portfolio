project: yofeii-delices
locale: en
eyebrow: Case study · Client project
title: Yofeii Délices, a spice shop and its back office
lead: 'A seasoning brand needed to sell online and run its shop on its own. I built the front end: the website where customers shop, and the back office where the team runs the store.'
seoTitle: Yofeii Délices, e-commerce and back office · Case study
seoDescription: Online shop built with Astro and React and Stripe payments, plus a back office to manage the catalogue, orders and customers.
meta:
  role: Lead front-end developer
  team: With a back-end developer (Laravel API)
  period: '2026'
  status: Live
context:
- Yofeii Délices sells seasonings and marinades. The brand wanted a website where customers discover the products, fill a cart and pay online.
- It also needed an internal tool to add a product, follow an order or change a banner without calling a developer.
role:
  paragraphs:
  - I built the front end of the website and the back office. The Laravel API was built in parallel by a back-end developer, and we coordinated at each delivery.
  highlights:
  - E-commerce website
  - Back office
  - API integration
  - Reusable components
approach:
  paragraphs:
  - On the website, customers browse the catalogue, open a product page, fill their cart and pay with Stripe. The cart is kept if they close the page.
  - In the back office, the team manages products, stock, orders and customers, and changes the home page banners. A dashboard sums up sales.
