learnings:
  - "Rückblickend würde ich Tests für das Backoffice schreiben. Die Service-Schicht eignet sich gut dafür, da sie nicht von React abhängt, und ihr Fehlen ist eine echte Lücke für ein Werkzeug, das mit Zahlungen arbeitet."
  - "Außerdem würde ich das Sitzungstoken in einem httpOnly-Cookie statt im localStorage des Browsers speichern, um den Zugang zu einem Werkzeug besser zu schützen, mit dem man Kunden Geld erstatten kann."
