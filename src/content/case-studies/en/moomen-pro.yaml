technical:
  intro: Three concrete problems shaped the project, and four safeguards protect its quality.
  decisions:
    - title: A layout broken only in production
      text: "Everything worked locally; once live, the desktop version looked like the mobile one. I traced it to the build's CSS compressor, which stripped Tailwind's media queries. I disabled it, since Vite already minifies the CSS, and forced a media query syntax that older browsers support."
    - title: The whole catalogue, not just page one
      text: "The shop API returned results page by page, but the site only showed the first page. I first added a \"Load more\" button, then numbered pagination, which is easier to read for a large catalogue."
    - title: Currency combined from two endpoints
      text: "Each country's currency came from a public endpoint, and the payment data from an older one. I combined both sources to show the right price in the right currency."
    - title: SEO, accessibility and performance
      text: "Canonical URLs, a generated sitemap, metadata and JSON-LD structured data. A skip link, landmarks and support for the reduced motion setting. Self-hosted fonts and compressed HTML, JavaScript and SVG."
    - title: Configuration that fails loudly
      text: "The API URL comes from an environment variable. If it is missing, the build stops with a clear message instead of producing an empty site."
  stack: [Astro, Tailwind CSS, TypeScript, REST API, Remotion]
results:
  intro: "The new website is live. It presents the app, shows the plans in each country's currency and sells supplies with direct ordering on WhatsApp."
  metrics:
    - value: "15"
      label: pages with a unified design
    - value: "2"
      label: APIs integrated, pricing and shop
    - value: "2"
      label: endpoints combined to show the right currency
learnings:
  - "Always test the production build, not just the development server: the layout bug only existed once the site was compiled."
  - "Looking back, I would add automated tests for the currency and pagination logic, and measure conversion, sign-ups and WhatsApp clicks, to validate the UX choices with data."
