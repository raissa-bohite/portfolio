technical:
  intro: Einige Entscheidungen haben mir die Arbeit mit einer API erleichtert, die sich gleichzeitig mit dem Front-End weiterentwickelte.
  decisions:
  - title: Ein immer aktueller Katalog
    text: Anfangs erschien ein im Back-Office hinzugefügtes Produkt nicht auf der Website. Ich habe die Seiten bei jedem Besuch erzeugen lassen, damit Produkte und Preise immer aktuell sind.
  - title: API-Aufrufe an einer Stelle
    text: Alle Anfragen laufen über dieselbe Funktion. Wenn sich die API änderte, musste ich nur eine Datei anpassen.
  - title: Wiederverwendbare Komponenten
    text: Farben, helles und dunkles Design, Buttons und Felder für alle Bildschirme. So konnte ich das Design erneuern, ohne die Seiten neu zu schreiben.
  - title: Melden, was mir auffiel
    text: Beim Testen der Zahlung sind mir zwei Punkte aufgefallen, die serverseitig abgesichert werden mussten. Ich habe sie dem Back-End-Entwickler schriftlich erklärt.
  stack:
  - Astro
  - React
  - TypeScript
  - Tailwind CSS
  - TanStack Query
  - Stripe
  - Laravel-API
results:
  intro: Website und Back-Office sind online. Das Team verwaltet Katalog, Bestellungen und Banner selbstständig.
  metrics:
  - value: 30+
    label: Bildschirme im Back-Office
  - value: '7'
    label: Wochen Entwicklung für das Back-Office
learnings:
- 'Die Arbeit mit einer API, die sich ändert, braucht Organisation: Alle Aufrufe an einer Stelle zu bündeln, hat mir viele Korrekturen erspart.'
- Ich hätte von Anfang an Tests schreiben sollen, vor allem für ein Werkzeug mit Zahlungen. Beim nächsten Projekt mache ich das.
