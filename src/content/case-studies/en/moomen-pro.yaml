technical:
  intro: My choices were mostly driven by concrete problems.
  decisions:
  - title: A layout broken only once published
    text: 'The website looked right on my computer but not once published: the desktop version looked like the mobile one. I found that the tool compressing the CSS removed part of the styles, and I turned it off.'
  - title: Showing the whole catalogue
    text: The API sent products page by page, but the website only showed the first page. I added pagination.
  - title: The right price in the right currency
    text: I combined two API responses to show each plan in the local currency.
  - title: SEO and accessibility basics
    text: A title and description per page, a sitemap, a skip link to the content and support for the reduced motion setting.
  stack:
  - Astro
  - Tailwind CSS
  - TypeScript
  - REST API
results:
  intro: The new website is live. It presents the app, shows the plans in each country's currency and lets customers order supplies on WhatsApp.
  metrics:
  - value: '15'
    label: pages with a unified design
  - value: '2'
    label: APIs integrated, pricing and shop
learnings:
- 'Always test the published version, not just the development one: the layout bug only existed once the site was live.'
- Next time, I will track sign-ups and clicks to WhatsApp to know whether the design choices work.
