project: yofeii-delices
locale: en
eyebrow: Case study · Client project
title: Yofeii Délices, a spice shop and its back office
lead: "A seasoning and marinade brand needed to sell online and run its shop without relying on a developer. I built the whole front end: the site where customers buy, and the back office where the team runs the shop."
seoTitle: Yofeii Délices, e-commerce and back office · Case study
seoDescription: An Astro and React online shop with Stripe payments, and a React back office of more than thirty screens for catalogue, orders and customers.
meta:
  role: Lead front-end developer
  team: With a back-end developer (Laravel API)
  period: "2026"
  status: Live
context:
  - "Yofeii Délices sells seasonings and marinades for thieb, fish, meat and gratins. The brand needed a site where customers can discover the products, fill a cart, create an account and pay securely online."
  - "It also needed an internal tool. The goal was simple: make the team independent. Adding a product, tracking an order, refunding a customer or changing a banner on the site should no longer require a developer."
role:
  paragraphs:
    - "I built the entire front end of the project: the e-commerce site and the back office. The back end, a Laravel API, was built in parallel by another developer, with whom I worked throughout the project."
  highlights:
    - E-commerce site in Astro and React
    - Back office with more than 30 screens
    - Stripe payments and security
    - Design system and visual redesign
approach:
  paragraphs:
    - "On the site, visitors browse the catalogue, view each product with its photos, ingredients and customer reviews, and can buy bundles that group several products. The cart is kept when the page is closed, and saved on the server when the customer is signed in. Customers sign in with a code sent by email, shipping costs are calculated from the country and the cart weight, and payment goes through Stripe: card, Apple Pay or Google Pay."
    - "The back office has more than thirty screens across about fifteen business areas. Its core is the catalogue: products, categories, ingredients and bundles with their own stock. Administrators track each order, change its status, set a delivery date and can refund a Stripe payment in part or in full. They also manage shipping countries, customers, newsletters, review and testimonial moderation, and the home page banners. A dashboard sums up activity: revenue, trending products and latest orders."
