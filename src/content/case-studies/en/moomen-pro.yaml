project: moomen-pro
locale: en
eyebrow: Case study · Client project
title: Moomen Pro, a website that makes people want to sign up
lead: "Moomen Pro helps West African retailers manage their sales, stock, receipts and customers from their phone. I rebuilt its website: product presentation, pricing in the local currency and a supplies shop."
seoTitle: Moomen Pro, website redesign and shop · Case study
seoDescription: An Astro redesign of the Moomen Pro website, a point-of-sale app for small businesses, with pricing by country and a supplies shop ordered via WhatsApp.
meta:
  role: Front-end developer, UI/UX and API integration
  team: For Moomen Pro (KORANEX)
  period: "2026"
  status: Live
context:
  - "Moomen Pro is a point-of-sale and management app for small businesses in West Africa: sales, stock, orders, customers, debts and PDF receipts."
  - "Its old website did not showcase the product: the design was dated and the experience unengaging, so it did not make people want to sign up. The client wanted a modern site that presents the app, shows the plans clearly and also sells its supplies, such as thermal printers and paper rolls."
role:
  paragraphs:
    - "I handled the front end from start to finish: the UI/UX design of every page, from the home page to the legal pages, then their development and the integration of two APIs, one for pricing and one for the shop."
  highlights:
    - UI/UX design of about fifteen pages
    - Pricing API integration
    - Supplies shop
    - Promo video made with Remotion
approach:
  paragraphs:
    - "The audience browses mostly on mobile, sometimes on a slow connection. The site is therefore generated as static HTML pages, which load fast and rank well."
    - "In this market, buying often happens through a conversation. Instead of a cart, each product has a button that opens WhatsApp with the product already filled in: one step fewer, and a habit customers already have. Prices are shown in the user's local currency, so nobody has to convert when choosing a plan. The same backgrounds, typography and components are used on every page, legal pages included."
