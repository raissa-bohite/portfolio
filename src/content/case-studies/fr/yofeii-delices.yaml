technical:
  intro: L'API évoluait en même temps que mon front, et le site encaisse de l'argent. Chaque choix répond à l'une de ces deux contraintes.
  decisions:
    - title: Un catalogue toujours à jour
      text: "Le site était d'abord généré une seule fois, à la mise en ligne : un produit ajouté dans le back-office n'apparaissait pas. J'ai repéré le problème, expliqué la solution à l'équipe backend dans un document, puis passé le site en rendu serveur. Produits, prix et stocks sont désormais toujours à jour."
    - title: Le paiement confirmé par Stripe
      text: "En relisant le code, j'ai découvert que c'était le navigateur qui annonçait au serveur qu'une commande était payée. J'ai supprimé ce fonctionnement : c'est maintenant Stripe qui prévient directement le serveur, et le site attend cette confirmation."
    - title: Des prix recalculés par le serveur
      text: "Les prix étaient envoyés par le navigateur, donc modifiables. La correction devait se faire côté serveur : j'ai rédigé pour l'équipe backend un document avec un exemple d'attaque et la liste des corrections à faire."
    - title: Une seule porte vers l'API
      text: "Dans le back-office, toutes les requêtes passent par une fonction apiFetch, sous des services en TypeScript pur et des hooks TanStack Query. Quand l'API changeait un champ, je ne modifiais qu'un fichier, sans toucher aux pages."
    - title: Un mode démo hors production
      text: "Quand l'API était indisponible, une variable d'environnement simulait une quarantaine d'endpoints en mémoire. Ce code est chargé dynamiquement, donc absent de la production, et un badge rappelle qu'il s'agit de données fictives."
    - title: Un design system pour trente écrans
      text: "Tokens, thème clair et sombre, composants de base rangés selon l'Atomic Design. C'est ce socle qui m'a permis de refaire tout le visuel en juin sans réécrire la logique des pages."
  stack: [Astro, React 19, TypeScript, Vite, TanStack Query, Tailwind CSS 4, React Router 7, Framer Motion, Stripe, API Laravel]
results:
  intro: "Le site et le back-office sont en ligne. La marque gère seule son catalogue, ses commandes et son contenu."
  metrics:
    - value: 30+
      label: écrans dans le back-office
    - value: "7"
      label: semaines pour développer le back-office
    - value: "40"
      label: endpoints simulés en mode démo
    - value: "2"
      label: failles de paiement repérées et documentées
learnings:
  - "Avec le recul, j'écrirais des tests pour le back-office. La couche de services s'y prête très bien, puisqu'elle ne dépend pas de React, et c'est un vrai manque pour un outil qui touche aux paiements."
  - "Je stockerais aussi le jeton de connexion dans un cookie httpOnly plutôt que dans le localStorage du navigateur, pour mieux protéger l'accès à un outil qui permet de rembourser des clients."
