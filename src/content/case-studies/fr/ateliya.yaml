technical:
  intro: J'ai cherché à garder le site rapide et les formulaires fiables.
  decisions:
  - title: Rester sur Astro
    text: 'On m''a d''abord demandé de passer le site sur Next.js. Après trois jours, je suis revenue à Astro : pour un site vitrine, il charge moins de JavaScript, donc les pages s''affichent plus vite.'
  - title: React seulement là où il sert
    text: React n'est utilisé que sur la page des tarifs et sur l'inscription, les deux pages avec un formulaire en plusieurs étapes.
  - title: Des formulaires clairs
    text: Vérification de l'email, du téléphone et du mot de passe, récapitulatif avant l'envoi, et messages d'erreur compréhensibles.
  - title: Un texte lisible par tous
    text: Après un contrôle d'accessibilité, j'ai foncé une couleur de texte qui manquait de contraste.
  stack:
  - Astro
  - React
  - Tailwind CSS
  - TypeScript
results:
  intro: Le nouveau site est en ligne. Il garde les parcours d'inscription et d'abonnement, avec un design fidèle à la charte de la cliente.
  metrics:
  - value: '2'
    label: pages seulement utilisent React
  - value: '4'
    label: moyens de paiement mobile pris en charge
learnings:
- 'Choisir l''outil selon le besoin : revenir à Astro après trois jours sur Next.js était la bonne décision pour ce site.'
- 'Les détails prennent du temps : il m''a fallu une dizaine d''essais pour que les maquettes de l''application s''affichent bien sur tous les écrans.'
