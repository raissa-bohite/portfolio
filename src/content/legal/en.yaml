    title: Personal data
    paragraphs:
      - "The only place where you share data is the contact form: your name, your email address, the type of request and your message."
      - "This information is used only to reply to you. It is never sold, shared or used for advertising. It is delivered by email through the Resend sending service, then kept for 12 months at most before being deleted."
      - "Under Ivorian law no. 2013-450 of 19 June 2013 on the protection of personal data, you can ask to access, correct or delete your data by writing to {email}. You can also contact ARTCI, the Ivorian data protection authority."
  - id: cookies
    title: Cookies and analytics
    paragraphs:
      - "This site sets no advertising or tracking cookies. Traffic is measured with Cloudflare Web Analytics, which works without cookies and without identifying visitors. That is why no consent banner is shown."
      - Your light or dark theme choice is stored in your browser. It never leaves your device.
      - The form is protected against automated submissions by Cloudflare Turnstile, which analyses technical browsing signals without advertising cookies.
