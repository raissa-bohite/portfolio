project: moomen-pro
locale: de
eyebrow: Fallstudie · Kundenprojekt
title: Moomen Pro, eine Website, die Lust auf Anmeldung macht
lead: "Moomen Pro hilft Händlern in Westafrika, Verkäufe, Bestände, Belege und Kunden vom Smartphone aus zu verwalten. Ich habe die Website neu gebaut: Produktvorstellung, Preise in der Landeswährung und ein Shop für Verbrauchsmaterial."
seoTitle: Moomen Pro, Website-Neugestaltung und Shop · Fallstudie
seoDescription: Neugestaltung der Website von Moomen Pro, einer Kassen-App für KMU, mit Astro, Preisen nach Land und einem Shop mit Bestellung über WhatsApp.
meta:
  role: Frontend-Entwicklerin, UI/UX und API-Integration
  team: Für Moomen Pro (KORANEX)
  period: "2026"
  status: Online
context:
  - "Moomen Pro ist eine Kassen- und Verwaltungs-App für KMU in Westafrika: Verkäufe, Bestände, Bestellungen, Kunden, offene Posten und PDF-Belege."
  - "Die alte Website stellte das Produkt nicht gut dar: Das Design war veraltet und das Erlebnis wenig ansprechend, sodass sie nicht zur Anmeldung motivierte. Der Kunde wollte eine moderne Website, die die App vorstellt, die Angebote klar zeigt und auch Verbrauchsmaterial wie Thermodrucker und Papierrollen verkauft."
role:
  paragraphs:
    - "Ich habe das Frontend von Anfang bis Ende übernommen: das UI/UX-Design aller Seiten, von der Startseite bis zu den rechtlichen Seiten, dann ihre Entwicklung und die Anbindung von zwei APIs, für die Preise und für den Shop."
  highlights:
    - UI/UX-Design von rund fünfzehn Seiten
    - Anbindung der Preis-API
    - Shop für Verbrauchsmaterial
    - Präsentationsvideo mit Remotion
approach:
  paragraphs:
    - "Die Zielgruppe surft vor allem mobil, oft mit langsamer Verbindung. Die Website wird daher als statische HTML-Seiten erzeugt, die schnell laden und gut gefunden werden."
    - "Auf diesem Markt läuft ein Kauf oft über ein Gespräch. Statt eines Warenkorbs hat jedes Produkt einen Button, der WhatsApp mit dem bereits eingetragenen Produkt öffnet: ein Schritt weniger und eine vertraute Gewohnheit. Die Preise erscheinen in der Währung des Landes, damit niemand bei der Wahl des Abos umrechnen muss. Hintergründe, Typografie und Komponenten sind auf allen Seiten gleich, auch auf den rechtlichen Seiten."
