technical:
  intro: Drei konkrete Probleme haben das Projekt geprägt, und vier Schutzmaßnahmen sichern seine Qualität.
  decisions:
    - title: Ein Layout, das nur in Produktion kaputt war
      text: "Lokal funktionierte alles; online sah die Desktop-Version aus wie die mobile. Ich habe die Ursache im CSS-Kompressor des Builds gefunden, der die Media Queries von Tailwind entfernte. Ich habe ihn deaktiviert, da Vite das CSS bereits minifiziert, und eine Media-Query-Syntax erzwungen, die auch ältere Browser verstehen."
    - title: Der ganze Katalog, nicht nur die erste Seite
      text: "Die Shop-API lieferte ihre Ergebnisse seitenweise, die Website zeigte aber nur die erste Seite. Ich habe zuerst einen Button „Mehr laden“ ergänzt, dann eine nummerierte Paginierung, die bei einem großen Katalog übersichtlicher ist."
    - title: Die Währung aus zwei Endpunkten
      text: "Die Währung jedes Landes kam von einem öffentlichen Endpunkt, die Zahlungsdaten von einem älteren. Ich habe beide Quellen kombiniert, um den richtigen Preis in der richtigen Währung anzuzeigen."
    - title: SEO, Barrierefreiheit und Performance
      text: "Kanonische URLs, eine generierte Sitemap, Metadaten und strukturierte Daten in JSON-LD. Ein Skip-Link, Landmarks und Unterstützung der Einstellung für reduzierte Bewegung. Selbst gehostete Schriften und komprimiertes HTML, JavaScript und SVG."
    - title: Eine Konfiguration, die klar scheitert
      text: "Die API-URL kommt aus einer Umgebungsvariable. Fehlt sie, bricht der Build mit einer klaren Meldung ab, statt eine leere Website zu erzeugen."
  stack: [Astro, Tailwind CSS, TypeScript, REST-API, Remotion]
results:
  intro: "Die neue Website ist online. Sie stellt die App vor, zeigt die Angebote in der Währung jedes Landes und verkauft Verbrauchsmaterial mit direkter Bestellung über WhatsApp."
  metrics:
    - value: "15"
      label: Seiten mit einheitlichem Design
    - value: "2"
      label: angebundene APIs, Preise und Shop
    - value: "2"
      label: kombinierte Endpunkte für die richtige Währung
learnings:
  - "Immer den Produktions-Build testen, nicht nur den Entwicklungsserver: Der Layout-Fehler trat erst nach dem Kompilieren auf."
  - "Rückblickend würde ich automatisierte Tests für die Währungs- und Paginierungslogik ergänzen und die Conversion messen, also Anmeldungen und WhatsApp-Klicks, um die UX-Entscheidungen mit Daten zu belegen."
