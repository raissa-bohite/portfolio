technical:
  intro: La décision la plus importante a été de revenir à Astro. Les autres choix protègent la performance et la sécurité des deux parcours sensibles.
  decisions:
    - title: De Next.js à Astro
      text: "Comme demandé au départ, j'ai migré le site vers Next.js en export statique. Trois jours plus tard, je suis revenue à Astro, en gardant la version Next.js sur une branche. Un site vitrine dont rien ne change d'une requête à l'autre n'a pas besoin de charger un framework JavaScript sur chaque page."
    - title: React seulement où il sert
      text: "React n'est chargé que sur les tarifs et l'inscription, les deux pages avec un vrai état en plusieurs étapes et des appels API. J'ai vérifié qu'aucune trace de React n'apparaît dans le HTML de l'accueil."
    - title: Une vidéo d'accueil qui ne ralentit pas la page
      text: "La photo est le fond par défaut, ce qui protège le temps d'affichage. La vidéo n'est ajoutée que sur grand écran, sans réduction des animations ni économie de données, et n'apparaît en fondu qu'une fois sa lecture vraiment lancée. Un bouton permet de la mettre en pause."
    - title: Des animations sans bibliothèque
      text: "Un IntersectionObserver et des classes CSS suffisent. Les éléments sont visibles par défaut : si le JavaScript échoue, rien ne reste caché."
    - title: Des formulaires qui ne font pas confiance
      text: "Validation stricte de l'email et du téléphone, mot de passe d'au moins 8 caractères avec indicateur de force, récapitulatif avant l'envoi et garde contre la double soumission. Les messages d'erreur sont toujours des textes prévus, jamais l'erreur brute, et la longueur des champs reçus de l'API est bornée."
    - title: Un paiement tenu à distance
      text: "L'URL de redirection vers le paiement n'est acceptée qu'en https, l'iframe est isolée avec sandbox, et aucune carte bancaire n'est saisie sur le site."
  stack: [Astro 7, React, Tailwind CSS, TypeScript, mobile money]
results:
  intro: "Le nouveau site est en ligne, entièrement statique, avec React limité à deux pages. Le SEO s'appuie sur des données structurées Organization, SoftwareApplication et FAQPage, un sitemap automatique et une image Open Graph aux couleurs de la marque. Les images sont servies en AVIF et WebP."
  metrics:
    - value: "2"
      label: pages seulement chargent React
    - value: "0"
      label: trace de React dans le HTML de l'accueil
    - value: "5,17:1"
      label: "contraste du texte après l'audit WCAG, contre 4,17:1 avant"
    - value: "4"
      label: moyens de paiement mobile pris en charge
learnings:
  - "Choisir l'outil selon le besoin, pas selon la mode. Revenir en arrière après trois jours sur Next.js n'était pas un échec : c'était la bonne décision pour un site où rien ne change d'une visite à l'autre."
  - "Les détails demandent de la patience. Il m'a fallu une dizaine d'itérations, détourage, recadrage, tailles adaptées à la hauteur de l'écran, pour que les maquettes de la section de présentation restent cohérentes."
