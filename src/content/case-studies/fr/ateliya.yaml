project: ateliya
locale: fr
eyebrow: Étude de cas · Mission client
title: Ateliya, refaire le site d'une app pour ateliers de couture
lead: "Ateliya aide les couturiers d'Afrique de l'Ouest à gérer clients, mesures, commandes et paiements. J'ai refait le design de son site vitrine, celui qui donne envie de télécharger l'app et de s'abonner, avec les mêmes pages, les mêmes parcours et les mêmes API."
seoTitle: Ateliya, refonte du site vitrine · Étude de cas
seoDescription: Refonte du site d'Ateliya en Astro, avec React chargé seulement sur l'inscription et les tarifs, formulaires sécurisés et paiement par mobile money.
meta:
  role: Développeuse front-end
  team: Seule, avec validation de la cliente page par page
  period: Octobre 2026
  status: En ligne
context:
  - "Ateliya est une application de gestion pour les couturiers et les ateliers de couture, sur le marché ouest-africain, avec un paiement par mobile money. Le site vitrine a un rôle précis : donner envie de télécharger l'app et de s'abonner."
  - "L'ancien site, déjà en Astro, fonctionnait, mais son design ne convenait plus à la cliente. Le périmètre était donc une refonte du design uniquement : mêmes pages, mêmes parcours, mêmes API."
role:
  paragraphs:
    - "J'ai mené le projet seule, de bout en bout : cadrage, design à partir de la charte de la cliente, intégration, sécurité des formulaires, SEO et accessibilité. La cliente validait chaque page avant que je passe à la suivante."
    - "Plusieurs contraintes cadraient le travail : un hébergement mutualisé sans Node, donc un site entièrement statique ; une charte imposée, vert, or, ivoire et la police Cormorant Garamond ; et deux parcours sensibles, une inscription qui crée un vrai compte et un abonnement avec un vrai paiement par Wave, Orange Money, MTN ou Moov."
  highlights:
    - Cadrage et design
    - Intégration Astro et React
    - Sécurité des formulaires et du paiement
    - SEO et accessibilité
approach:
  paragraphs:
    - "Je me suis inspirée de Paykko et de Djamo : sections en couleur pleine, ton énergique, animations. J'ai repris leur mécanique sans leur police : Cormorant Garamond reste, par respect de la charte."
    - "Un motif de point de couture sépare les sections et ancre le site dans l'univers du métier. La section de présentation reste fixée pendant le défilement, et la maquette de l'app passe par trois états : clients, commandes, activité. Les fonctionnalités sont illustrées en isométrique, et une vraie capture de l'app est incrustée dans la photo d'accueil."
