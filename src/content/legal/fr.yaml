  - id: data
    title: Données personnelles
    paragraphs:
      - "Le seul endroit où vous transmettez des données est le formulaire de contact : votre nom, votre adresse email, le type de demande et votre message."
      - "Ces informations servent uniquement à vous répondre. Elles ne sont ni vendues, ni partagées, ni utilisées à des fins publicitaires. Elles sont acheminées par email via le service d'envoi Resend, puis conservées 12 mois au plus avant d'être supprimées."
      - "Conformément à la loi ivoirienne n° 2013-450 du 19 juin 2013 relative à la protection des données à caractère personnel, vous pouvez demander à consulter, corriger ou supprimer vos données en écrivant à {email}. Vous pouvez aussi saisir l'ARTCI, l'autorité ivoirienne de protection des données."
  - id: cookies
    title: Cookies et mesure d'audience
    paragraphs:
      - "Ce site ne dépose aucun cookie publicitaire ni de suivi. La fréquentation est mesurée avec Cloudflare Web Analytics, un outil qui fonctionne sans cookie et sans identifier les visiteurs. C'est pourquoi aucun bandeau de consentement ne s'affiche."
      - "Votre choix de thème clair ou sombre est gardé dans votre navigateur. Il ne quitte jamais votre appareil."
      - Le formulaire est protégé contre les envois automatisés par Cloudflare Turnstile, qui analyse des signaux techniques de navigation sans cookie publicitaire.
  - id: property
    title: Propriété intellectuelle
    paragraphs:
      - "Le code source du portfolio est publié sur GitHub sous licence MIT. Les textes, les photos et le design restent la propriété de Raïssa Bohité : tous droits réservés."
      - Les projets présentés restent la propriété de leurs clients respectifs. Les noms, logos et captures de Yofeii Délices, Ateliya, Moomen Pro et de l'ERP scolaire sont montrés avec leur accord, à titre de références professionnelles.
