project: yofeii-delices
locale: de
eyebrow: Fallstudie · Kundenprojekt
title: Yofeii Délices, ein Gewürzshop und sein Backoffice
lead: "Eine Marke für Würzmischungen und Marinaden wollte online verkaufen und ihren Shop ohne Entwickler verwalten. Ich habe das gesamte Frontend gebaut: die Website, auf der Kunden einkaufen, und das Backoffice, mit dem das Team den Shop betreibt."
seoTitle: Yofeii Délices, E-Commerce und Backoffice · Fallstudie
seoDescription: Onlineshop mit Astro, React und Stripe-Zahlung sowie ein React-Backoffice mit über dreißig Ansichten für Katalog, Bestellungen und Kunden.
meta:
  role: Leitende Frontend-Entwicklerin
  team: Mit einem Backend-Entwickler (Laravel-API)
  period: "2026"
  status: Online
context:
  - "Yofeii Délices verkauft Würzmischungen und Marinaden für Thieb, Fisch, Fleisch und Gratins. Die Marke brauchte eine Website, auf der Kunden die Produkte entdecken, einen Warenkorb füllen, ein Konto anlegen und sicher online bezahlen."
  - "Außerdem brauchte sie ein internes Werkzeug. Das Ziel war einfach: Das Team sollte selbstständig arbeiten. Ein Produkt anlegen, eine Bestellung verfolgen, einem Kunden Geld erstatten oder ein Banner der Website ändern sollte keinen Entwickler mehr erfordern."
role:
  paragraphs:
    - "Ich habe das gesamte Frontend des Projekts entwickelt: die E-Commerce-Website und das Backoffice. Das Backend, eine Laravel-API, wurde parallel von einem anderen Entwickler gebaut, mit dem ich während des ganzen Projekts zusammengearbeitet habe."
  highlights:
    - E-Commerce-Website mit Astro und React
    - Backoffice mit über 30 Ansichten
    - Stripe-Zahlung und Sicherheit
    - Designsystem und visuelles Redesign
approach:
  paragraphs:
    - "Auf der Website durchstöbern Besucher den Katalog, sehen jedes Produkt mit Fotos, Zutaten und Kundenbewertungen und können Sets kaufen, die mehrere Produkte bündeln. Der Warenkorb bleibt erhalten, wenn die Seite geschlossen wird, und wird bei angemeldeten Kunden auf dem Server gespeichert. Die Anmeldung erfolgt mit einem Code per E-Mail, die Versandkosten richten sich nach Land und Gewicht des Warenkorbs, und bezahlt wird über Stripe: Karte, Apple Pay oder Google Pay."
    - "Das Backoffice umfasst über dreißig Ansichten in rund fünfzehn Fachbereichen. Herzstück ist der Katalog: Produkte, Kategorien, Zutaten und Sets mit eigenem Bestand. Administratoren verfolgen jede Bestellung, ändern ihren Status, legen ein Lieferdatum fest und können eine Stripe-Zahlung ganz oder teilweise erstatten. Sie verwalten außerdem Lieferländer, Kunden, Newsletter, die Moderation von Bewertungen und Erfahrungsberichten sowie die Banner der Startseite. Ein Dashboard fasst die Aktivität zusammen: Umsatz, gefragte Produkte und letzte Bestellungen."
