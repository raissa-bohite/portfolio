project: ateliya
locale: en
eyebrow: Case study · Client project
title: Ateliya, redesigning the website of an app for tailoring workshops
lead: Ateliya helps West African tailors manage their customers, measurements and orders. I redesigned its website, which encourages people to download the app and subscribe.
seoTitle: Ateliya, website redesign · Case study
seoDescription: Design overhaul of the Ateliya website in Astro, with sign-up and subscription paid by mobile money.
meta:
  role: Front-end developer
  team: Solo, with page-by-page client approval
  period: October 2026
  status: Live
context:
- Ateliya is a management app for tailoring workshops, paid by mobile money. Its website is there to make people want to download the app and subscribe.
- The old website worked, but the client no longer liked its design. The job was to redo the design while keeping the same pages, flows and APIs.
role:
  paragraphs:
  - 'I led the redesign on my own, from design to launch, following the client''s brand guidelines: green, gold, ivory and the Cormorant Garamond typeface. The client approved each page before I moved on to the next.'
  highlights:
  - Design from the brand guidelines
  - Astro development
  - Sign-up forms
  - Accessibility
approach:
  paragraphs:
  - 'I took inspiration from payment app websites: full-colour sections, an energetic tone and light animations.'
  - A stitching pattern separates the sections and recalls the craft. A real screenshot of the app appears in the home photo, and a mockup shows customers, orders and activity.
