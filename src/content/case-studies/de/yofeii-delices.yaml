project: yofeii-delices
locale: de
eyebrow: Fallstudie · Kundenprojekt
title: Yofeii Délices, ein Gewürzshop und sein Backoffice
lead: 'Eine Gewürzmarke wollte online verkaufen und ihren Shop selbst verwalten. Ich habe das Front-End entwickelt: die Website, auf der Kundinnen und Kunden einkaufen, und das Back-Office, mit dem das Team den Shop führt.'
seoTitle: Yofeii Délices, E-Commerce und Backoffice · Fallstudie
seoDescription: Onlineshop mit Astro, React und Stripe-Zahlung sowie ein Back-Office für Katalog, Bestellungen und Kundschaft.
meta:
  role: Leitende Frontend-Entwicklerin
  team: Mit einem Backend-Entwickler (Laravel-API)
  period: '2026'
  status: Online
context:
- Yofeii Délices verkauft Gewürzmischungen und Marinaden. Die Marke wollte eine Website, auf der die Kundschaft Produkte entdeckt, einen Warenkorb füllt und online bezahlt.
- Außerdem brauchte sie ein internes Werkzeug, um ein Produkt hinzuzufügen, eine Bestellung zu verfolgen oder ein Banner zu ändern, ohne einen Entwickler zu fragen.
role:
  paragraphs:
  - Ich habe das Front-End der Website und des Back-Office entwickelt. Die Laravel-API wurde parallel von einem Back-End-Entwickler gebaut, mit dem ich mich bei jeder Lieferung abgestimmt habe.
  highlights:
  - E-Commerce-Website
  - Back-Office
  - API-Anbindung
  - Wiederverwendbare Komponenten
approach:
  paragraphs:
  - Auf der Website durchsucht die Kundschaft den Katalog, öffnet eine Produktseite, füllt den Warenkorb und bezahlt mit Stripe. Der Warenkorb bleibt erhalten, wenn man die Seite schließt.
  - Im Back-Office verwaltet das Team Produkte, Lagerbestand, Bestellungen und Kundschaft und ändert die Banner der Startseite. Ein Dashboard fasst die Verkäufe zusammen.
