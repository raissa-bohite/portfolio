project: ateliya
locale: fr
eyebrow: Étude de cas · Mission client
title: Ateliya, refaire le site d'une app pour ateliers de couture
lead: Ateliya aide les couturiers d'Afrique de l'Ouest à gérer leurs clients, leurs mesures et leurs commandes. J'ai refait le design de son site, qui donne envie de télécharger l'application et de s'abonner.
seoTitle: Ateliya, refonte du site vitrine · Étude de cas
seoDescription: Refonte du design du site d'Ateliya en Astro, avec inscription et abonnement par mobile money.
meta:
  role: Développeuse front-end
  team: Seule, avec validation de la cliente page par page
  period: Octobre 2026
  status: En ligne
context:
- Ateliya est une application de gestion pour les ateliers de couture, avec un paiement par mobile money. Son site sert à donner envie de télécharger l'application et de s'abonner.
- L'ancien site fonctionnait, mais son design ne convenait plus à la cliente. Il fallait refaire le design en gardant les mêmes pages, les mêmes parcours et les mêmes API.
role:
  paragraphs:
  - 'J''ai mené la refonte seule, du design à la mise en ligne, en respectant la charte de la cliente : vert, or, ivoire et la police Cormorant Garamond. La cliente validait chaque page avant que je passe à la suivante.'
  highlights:
  - Design à partir de la charte
  - Intégration en Astro
  - Formulaires d'inscription
  - Accessibilité
approach:
  paragraphs:
  - 'Je me suis inspirée de sites d''applications de paiement : sections en couleur pleine, ton dynamique, animations légères.'
  - Un motif de point de couture sépare les sections et rappelle le métier. Une vraie capture de l'application apparaît dans la photo d'accueil, et une maquette montre les clients, les commandes et l'activité.
  gallery:
