technical:
  intro: Mein Ziel war eine schnelle Website mit zuverlässigen Formularen.
  decisions:
  - title: Bei Astro bleiben
    text: 'Zuerst sollte ich die Website auf Next.js umstellen. Nach drei Tagen bin ich zu Astro zurückgekehrt: Für eine Präsentationswebsite lädt es weniger JavaScript, die Seiten erscheinen also schneller.'
  - title: React nur, wo es hilft
    text: React wird nur auf der Preisseite und bei der Registrierung genutzt, den beiden Seiten mit einem mehrstufigen Formular.
  - title: Klare Formulare
    text: Prüfung von E-Mail, Telefon und Passwort, eine Zusammenfassung vor dem Absenden und verständliche Fehlermeldungen.
  - title: Text, den alle lesen können
    text: Nach einer Barrierefreiheitsprüfung habe ich eine Textfarbe mit zu wenig Kontrast dunkler gemacht.
  stack:
  - Astro
  - React
  - Tailwind CSS
  - TypeScript
results:
  intro: Die neue Website ist online. Sie behält die Abläufe für Registrierung und Abo, mit einem Design, das den Markenvorgaben der Kundin treu bleibt.
  metrics:
  - value: '2'
    label: Seiten nutzen React
  - value: '4'
    label: mobile Zahlungsarten unterstützt
learnings:
- 'Das Werkzeug nach dem Bedarf wählen: Nach drei Tagen mit Next.js zu Astro zurückzukehren, war für diese Website die richtige Entscheidung.'
- 'Details brauchen Zeit: Ich habe etwa zehn Versuche gebraucht, bis die App-Mockups auf allen Bildschirmen gut aussahen.'
