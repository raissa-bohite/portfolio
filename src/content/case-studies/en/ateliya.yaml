technical:
  intro: The most important decision was going back to Astro. The other choices protect performance and the security of the two sensitive journeys.
  decisions:
    - title: From Next.js back to Astro
      text: "As initially requested, I migrated the site to Next.js with static export. Three days later, I went back to Astro and kept the Next.js version on a branch. A marketing site where nothing changes from one request to the next does not need to load a JavaScript framework on every page."
    - title: React only where it helps
      text: "React loads only on pricing and sign-up, the two pages with real multi-step state and API calls. I checked that no trace of React appears in the home page HTML."
    - title: A hero video that does not slow the page
      text: "The photo is the default background, which protects load time. The video is added only on large screens, without reduced motion or data saver, and fades in only once playback has really started. A button lets visitors pause it."
    - title: Animations without a library
      text: "An IntersectionObserver and CSS classes are enough. Elements are visible by default: if JavaScript fails, nothing stays hidden."
    - title: Forms that trust nothing
      text: "Strict email and phone validation, a password of at least 8 characters with a strength meter, a summary step before sending and a guard against double submission. Error messages are always predefined text, never the raw error, and the length of fields received from the API is capped."
    - title: Payment kept at arm's length
      text: "The payment redirect URL is accepted over https only, the iframe is sandboxed, and no card number is ever entered on the site."
  stack: [Astro 7, React, Tailwind CSS, TypeScript, mobile money]
results:
  intro: "The new site is live, fully static, with React limited to two pages. SEO relies on Organization, SoftwareApplication and FAQPage structured data, an automatic sitemap and an Open Graph image in the brand colours. Images are served as AVIF and WebP."
  metrics:
    - value: "2"
      label: pages only load React
    - value: "0"
      label: traces of React in the home page HTML
    - value: "5.17:1"
      label: "text contrast after the WCAG audit, up from 4.17:1"
    - value: "4"
      label: mobile payment methods supported
learnings:
  - "Choose the tool for the need, not for the trend. Going back after three days on Next.js was not a failure: it was the right call for a site where nothing changes from one visit to the next."
  - "Details take patience. It took about ten iterations, cut-outs, cropping, sizes based on screen height, to keep the showcase mockups consistent."
