technical:
  intro: Quelques choix m'ont aidée à travailler avec une API qui évoluait en même temps que le front.
  decisions:
  - title: Un catalogue toujours à jour
    text: Au départ, un produit ajouté dans le back-office n'apparaissait pas sur le site. J'ai fait générer les pages à chaque visite, pour que les produits et les prix soient toujours à jour.
  - title: Les appels à l'API au même endroit
    text: Toutes les requêtes passent par une même fonction. Quand l'API changeait, je n'avais qu'un fichier à modifier.
  - title: Des composants réutilisables
    text: Couleurs, thème clair et sombre, boutons et champs partagés par tous les écrans. Ça m'a permis de refaire le visuel sans réécrire les pages.
  - title: Signaler ce que je remarquais
    text: En testant le paiement, j'ai remarqué deux points à sécuriser côté serveur. Je les ai expliqués par écrit au développeur backend.
  stack:
  - Astro
  - React
  - TypeScript
  - Tailwind CSS
  - TanStack Query
  - Stripe
  - API Laravel
results:
  intro: Le site et le back-office sont en ligne. L'équipe gère elle-même son catalogue, ses commandes et ses bannières.
  metrics:
  - value: 30+
    label: écrans dans le back-office
  - value: '7'
    label: semaines pour développer le back-office
learnings:
- 'Travailler avec une API qui change demande de l''organisation : regrouper les appels au même endroit m''a évité beaucoup de corrections.'
- J'aurais dû écrire des tests dès le début, surtout pour un outil lié aux paiements. Je le ferai sur mon prochain projet.
