project: yofeii-delices
locale: fr
eyebrow: Étude de cas · Mission client
title: Yofeii Délices, une boutique d'épices et son back-office
lead: "Une marque d'assaisonnements et de marinades avait besoin de vendre en ligne et de gérer sa boutique sans dépendre d'un développeur. J'ai construit tout le front : le site où les clients achètent, et le back-office où l'équipe fait tourner la boutique."
seoTitle: Yofeii Délices, e-commerce et back-office · Étude de cas
seoDescription: Boutique en ligne Astro et React avec paiement Stripe, et back-office React de plus de trente écrans pour gérer catalogue, commandes et clients.
meta:
  role: Développeuse front-end principale
  team: Avec un développeur backend (API Laravel)
  period: "2026"
  status: En ligne
context:
  - "Yofeii Délices vend des assaisonnements et des marinades : pour le thieb, le poisson, la viande, les gratins. La marque avait besoin d'un site où ses clients découvrent les produits, remplissent un panier, créent un compte et paient en ligne en toute sécurité."
  - "Il lui fallait aussi un outil interne. L'objectif était simple : rendre l'équipe autonome. Ajouter un produit, suivre une commande, rembourser un client ou changer une bannière du site ne devait plus demander l'intervention d'un développeur."
role:
  paragraphs:
    - "J'ai développé tout le front du projet : le site e-commerce et le back-office. Le backend, une API Laravel, était développé en parallèle par un autre développeur, avec qui j'ai travaillé tout au long du projet."
  highlights:
    - Site e-commerce en Astro et React
    - Back-office de plus de 30 écrans
    - Paiement Stripe et sécurité
    - Design system et refonte visuelle
approach:
  paragraphs:
    - "Sur le site, le visiteur parcourt le catalogue, consulte chaque produit avec ses photos, ses ingrédients et les avis des clients, et peut acheter des coffrets qui regroupent plusieurs produits. Le panier est conservé quand on ferme la page, et enregistré sur le serveur quand le client est connecté. La connexion se fait avec un code reçu par email, les frais de livraison sont calculés selon le pays et le poids du panier, et le paiement passe par Stripe : carte bancaire, Apple Pay ou Google Pay."
    - "Le back-office compte plus de trente écrans, répartis sur une quinzaine de domaines métier. Le cœur, c'est le catalogue : produits, catégories, ingrédients et coffrets avec leur propre stock. L'administrateur suit chaque commande, change son statut, fixe une date de livraison et peut rembourser un paiement Stripe en partie ou en totalité. Il gère aussi les pays de livraison, les clients, les newsletters, la modération des avis et des témoignages, et les bannières de la page d'accueil. Un tableau de bord résume l'activité : chiffre d'affaires, produits tendance et dernières commandes."
