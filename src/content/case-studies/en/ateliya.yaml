project: ateliya
locale: en
eyebrow: Case study · Client project
title: Ateliya, redesigning the website of an app for tailoring workshops
lead: "Ateliya helps West African tailors manage clients, measurements, orders and payments. I redesigned its marketing website, the one that makes people download the app and subscribe, keeping the same pages, journeys and APIs."
seoTitle: Ateliya, website redesign · Case study
seoDescription: An Astro redesign of the Ateliya website, with React loaded only on sign-up and pricing, secure forms and mobile money payments.
meta:
  role: Front-end developer
  team: Solo, with page-by-page client approval
  period: October 2026
  status: Live
context:
  - "Ateliya is a management app for tailors and tailoring workshops in the West African market, with mobile money payments. Its marketing website has one job: make people want to download the app and subscribe."
  - "The old site, already built with Astro, worked, but its design no longer suited the client. The scope was therefore a design overhaul only: same pages, same journeys, same APIs."
role:
  paragraphs:
    - "I ran the project alone from start to finish: scoping, design based on the client's brand guidelines, development, form security, SEO and accessibility. The client approved each page before I moved on to the next."
    - "Several constraints framed the work: shared hosting without Node, so a fully static site; mandatory brand guidelines, green, gold, ivory and the Cormorant Garamond typeface; and two sensitive journeys, a sign-up that creates a real account and a subscription with real payment through Wave, Orange Money, MTN or Moov."
  highlights:
    - Scoping and design
    - Astro and React development
    - Form and payment security
    - SEO and accessibility
approach:
  paragraphs:
    - "I took inspiration from Paykko and Djamo: solid-colour sections, an energetic tone, animation. I borrowed their mechanics but not their typeface: Cormorant Garamond stays, out of respect for the brand guidelines."
    - "A stitch pattern separates the sections and roots the site in the trade. The showcase section stays pinned while scrolling, and the app mockup moves through three states: clients, orders, activity. Features are illustrated isometrically, and a real app screenshot is set into the home page photo."
