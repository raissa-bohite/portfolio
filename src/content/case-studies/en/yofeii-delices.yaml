technical:
  intro: A few choices helped me work with an API that changed at the same time as the front end.
  decisions:
  - title: A catalogue always up to date
    text: At first, a product added in the back office did not show up on the website. I had the pages generated on each visit, so products and prices are always up to date.
  - title: API calls in one place
    text: Every request goes through the same function. When the API changed, I only had one file to update.
  - title: Reusable components
    text: Colours, light and dark themes, buttons and fields shared by every screen. This let me redo the visual design without rewriting the pages.
  - title: Reporting what I noticed
    text: While testing the payment flow, I noticed two points to secure on the server. I explained them in writing to the back-end developer.
  stack:
  - Astro
  - React
  - TypeScript
  - Tailwind CSS
  - TanStack Query
  - Stripe
  - Laravel API
results:
  intro: The website and the back office are live. The team manages its catalogue, orders and banners on its own.
  metrics:
  - value: 30+
    label: screens in the back office
  - value: '7'
    label: weeks to build the back office
learnings:
- 'Working with a changing API takes organisation: keeping all calls in one place saved me a lot of fixes.'
- I should have written tests from the start, especially for a tool linked to payments. I will on my next project.
