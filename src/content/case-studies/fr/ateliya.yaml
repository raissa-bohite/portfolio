    frame: desktop
  - image: ../../../assets/case-studies/ateliya/testimonials.jpg
    alt: 'Section « Ateliya au quotidien » : trois témoignages de couturières sur des cartes en couleur pleine'
    caption: Témoignages
    frame: desktop
  - image: ../../../assets/case-studies/ateliya/faq.jpg
    alt: 'Questions fréquentes en accordéon : fonctionnement, essai gratuit, paiement, Android et iPhone, sécurité, prix'
    caption: Questions fréquentes
