technical:
  intro: Trois problèmes concrets ont marqué le projet, et quatre garde-fous protègent sa qualité.
  decisions:
    - title: Un responsive cassé seulement en production
      text: "En local, tout fonctionnait ; en ligne, la version ordinateur s'affichait comme sur mobile. J'ai remonté la piste jusqu'au compresseur CSS du build, qui supprimait les media queries de Tailwind. Je l'ai désactivé, puisque Vite minifie déjà le CSS, et j'ai forcé une syntaxe de media queries compatible avec les navigateurs plus anciens."
    - title: Tout le catalogue, pas seulement la première page
      text: "L'API de la boutique renvoyait ses résultats page par page, mais le site n'affichait que la première. J'ai d'abord ajouté un bouton « Charger plus », puis une pagination numérotée, plus lisible pour un grand catalogue."
    - title: Une devise réunie depuis deux endpoints
      text: "La devise de chaque pays venait d'un endpoint public, les données de paiement d'un endpoint plus ancien. J'ai combiné les deux sources pour afficher le bon prix dans la bonne monnaie."
    - title: SEO, accessibilité et performance
      text: "URL canoniques, sitemap généré, métadonnées et données structurées JSON-LD. Lien d'évitement, landmarks et respect du réglage « réduire les animations ». Polices auto-hébergées et compression du HTML, du JavaScript et des SVG."
    - title: Une configuration qui échoue clairement
      text: "L'URL de l'API passe par une variable d'environnement. Si elle manque, le build s'arrête avec un message explicite au lieu de produire un site vide."
  stack: [Astro, Tailwind CSS, TypeScript, API REST, Remotion]
results:
  intro: "Le nouveau site est en ligne. Il présente l'application, affiche les offres dans la devise de chaque pays et vend les consommables avec une commande directe sur WhatsApp."
  metrics:
    - value: "15"
      label: pages au design unifié
    - value: "2"
      label: API intégrées, tarifs et boutique
    - value: "2"
      label: endpoints réunis pour afficher la bonne devise
learnings:
  - "Toujours tester le build de production, pas seulement le serveur de développement : le bug de responsive n'existait qu'une fois le site compilé."
  - "Avec le recul, j'ajouterais des tests automatisés sur la logique de devise et de pagination, et je mesurerais la conversion, inscriptions et clics WhatsApp, pour valider les choix UX avec des données."
