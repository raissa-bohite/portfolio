technical:
  intro: Die API entwickelte sich parallel zu meinem Frontend, und über die Website fließt Geld. Jede Entscheidung antwortet auf eine dieser beiden Bedingungen.
  decisions:
    - title: Ein stets aktueller Katalog
      text: "Die Website wurde zunächst nur einmal beim Deployment erzeugt: Ein im Backoffice angelegtes Produkt erschien nicht. Ich habe das Problem erkannt, die Lösung dem Backend-Team schriftlich erklärt und die Website auf serverseitiges Rendering umgestellt. Produkte, Preise und Bestände sind jetzt immer aktuell."
    - title: Zahlung von Stripe bestätigt
      text: "Beim Lesen des Codes habe ich festgestellt, dass der Browser dem Server meldete, eine Bestellung sei bezahlt. Ich habe diesen Ablauf entfernt: Jetzt benachrichtigt Stripe den Server direkt, und die Website wartet auf diese Bestätigung."
    - title: Preise vom Server berechnet
      text: "Die Preise wurden vom Browser gesendet und ließen sich daher verändern. Die Korrektur musste auf dem Server erfolgen: Ich habe für das Backend-Team ein Dokument mit einem Angriffsbeispiel und der Liste der nötigen Korrekturen geschrieben."
    - title: Ein einziger Zugang zur API
      text: "Im Backoffice laufen alle Anfragen über eine Funktion apiFetch, unter Services in reinem TypeScript und TanStack-Query-Hooks. Wenn die API ein Feld umbenannte, änderte ich eine Datei und keine einzige Seite."
    - title: Ein Demo-Modus ohne Produktionscode
      text: "Wenn die API nicht erreichbar war, simulierte eine Umgebungsvariable rund vierzig Endpunkte im Speicher. Dieser Code wird dynamisch geladen und gelangt nie in die Produktion, und ein Hinweis zeigt an, dass es sich um fiktive Daten handelt."
    - title: Ein Designsystem für dreißig Ansichten
      text: "Tokens, helles und dunkles Theme und Basiskomponenten nach Atomic Design. Diese Grundlage hat es mir ermöglicht, im Juni das gesamte Design zu erneuern, ohne die Logik der Seiten neu zu schreiben."
  stack: [Astro, React 19, TypeScript, Vite, TanStack Query, Tailwind CSS 4, React Router 7, Framer Motion, Stripe, Laravel-API]
results:
  intro: "Website und Backoffice sind online. Die Marke verwaltet Katalog, Bestellungen und Inhalte selbstständig."
