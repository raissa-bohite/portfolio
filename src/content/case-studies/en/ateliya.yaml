technical:
  intro: I aimed to keep the website fast and the forms reliable.
  decisions:
  - title: Staying with Astro
    text: 'I was first asked to move the website to Next.js. After three days, I went back to Astro: for a showcase website, it loads less JavaScript, so pages display faster.'
  - title: React only where it helps
    text: React is only used on the pricing page and the sign-up page, the two pages with a multi-step form.
  - title: Clear forms
    text: Checks on email, phone and password, a summary before sending, and error messages people can understand.
  - title: Text everyone can read
    text: After an accessibility check, I darkened a text colour that lacked contrast.
  stack:
  - Astro
  - React
  - Tailwind CSS
  - TypeScript
results:
  intro: The new website is live. It keeps the sign-up and subscription flows, with a design true to the client's brand.
  metrics:
  - value: '2'
    label: pages only use React
  - value: '4'
    label: mobile payment methods supported
learnings:
- 'Pick the tool for the need: going back to Astro after three days on Next.js was the right call for this website.'
- 'Details take time: it took me about ten attempts for the app mockups to display well on every screen.'
