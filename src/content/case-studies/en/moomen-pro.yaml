project: moomen-pro
locale: en
eyebrow: Case study · Client project
title: The Moomen Pro landing page, a mobile and web sales management app for shopkeepers and small businesses
lead: 'Moomen Pro helps West African shop owners manage their sales and stock from their phone. I redesigned its website: app presentation, pricing and a shop for supplies.'
seoTitle: Moomen Pro, website redesign and shop · Case study
seoDescription: Astro redesign of the Moomen Pro website, a point-of-sale app for small businesses, with local pricing and a shop ordered through WhatsApp.
meta:
  role: Front-end developer, UI/UX and API integration
  team: For Moomen Pro (KORANEX)
  period: '2026'
  status: Live
context:
- 'Moomen Pro is a point-of-sale and management app for small businesses: sales, stock, customers and receipts.'
- The old website looked dated and did not make people want to sign up. The client wanted a modern website that presents the app, shows the plans and sells supplies such as printers and paper rolls.
role:
  paragraphs:
  - 'I designed and built the pages of the website, then connected them to two existing APIs: pricing and the shop. I also made the promo video through vibe motion design.'
  highlights:
  - Page design
  - API integration
  - Ordering on WhatsApp
  - Promo video
approach:
  paragraphs:
  - Visitors are mostly on mobile, sometimes with a slow connection. So I built a light website with static pages that load fast.
  - 'In the shop, each product has a button that opens WhatsApp with the product already filled in: this is how customers are used to ordering. Prices are shown in the local currency.'
