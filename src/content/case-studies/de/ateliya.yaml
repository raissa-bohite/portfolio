project: ateliya
locale: de
eyebrow: Fallstudie · Kundenprojekt
title: Ateliya, die Website einer App für Schneiderateliers neu gestalten
lead: Ateliya hilft Schneiderinnen und Schneidern in Westafrika, Kundschaft, Maße und Aufträge zu verwalten. Ich habe das Design der Website erneuert, die Lust machen soll, die App herunterzuladen und ein Abo abzuschließen.
seoTitle: Ateliya, Neugestaltung der Website · Fallstudie
seoDescription: Neues Design für die Website von Ateliya mit Astro, mit Registrierung und Abo per Mobile Money.
meta:
  role: Frontend-Entwicklerin
  team: Allein, mit Freigabe jeder Seite durch die Kundin
  period: Oktober 2026
  status: Online
context:
- Ateliya ist eine Verwaltungs-App für Schneidereien, bezahlt per Mobile Money. Die Website soll Lust machen, die App herunterzuladen und ein Abo abzuschließen.
- Die alte Website funktionierte, aber ihr Design gefiel der Kundin nicht mehr. Die Aufgabe war ein neues Design mit denselben Seiten, Abläufen und APIs.
role:
  paragraphs:
  - 'Ich habe die Neugestaltung allein durchgeführt, vom Design bis zum Launch, nach den Markenvorgaben der Kundin: Grün, Gold, Elfenbein und die Schrift Cormorant Garamond. Die Kundin hat jede Seite freigegeben, bevor ich zur nächsten überging.'
  highlights:
  - Design nach Markenvorgaben
  - Entwicklung mit Astro
  - Registrierungsformulare
  - Barrierefreiheit
approach:
  paragraphs:
  - 'Inspiriert haben mich Websites von Bezahl-Apps: vollfarbige Abschnitte, ein dynamischer Ton und leichte Animationen.'
  - Ein Steppstich-Motiv trennt die Abschnitte und erinnert an das Handwerk. Ein echter Screenshot der App erscheint im Startfoto, und ein Mockup zeigt Kundschaft, Aufträge und Aktivität.
