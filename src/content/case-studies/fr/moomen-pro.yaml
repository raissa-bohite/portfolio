project: moomen-pro
locale: fr
eyebrow: Étude de cas · Mission client
title: Moomen Pro, un site qui donne envie de s'inscrire
lead: "Moomen Pro aide les commerçants d'Afrique de l'Ouest à gérer leurs ventes, leurs stocks, leurs reçus et leurs clients depuis leur téléphone. J'ai refait son site : présentation du produit, tarifs dans la devise du pays et boutique de consommables."
seoTitle: Moomen Pro, refonte du site et boutique · Étude de cas
seoDescription: Refonte en Astro du site de Moomen Pro, application de caisse pour PME, avec tarifs par pays et boutique de consommables commandée sur WhatsApp.
meta:
  role: Développeuse front-end, UI/UX et intégration API
  team: Pour Moomen Pro (KORANEX)
  period: "2026"
  status: En ligne
context:
  - "Moomen Pro est une application de caisse et de gestion pour les PME d'Afrique de l'Ouest : ventes, stocks, commandes, clients, dettes et reçus PDF."
  - "Son ancien site ne mettait pas le produit en valeur : le design était daté et l'expérience peu engageante, si bien qu'il ne donnait pas envie de s'inscrire. Le client voulait un site moderne qui présente l'application, affiche clairement les offres et vende aussi ses consommables, comme les imprimantes thermiques et les rouleaux."
role:
  paragraphs:
    - "J'ai pris en charge le front-end de bout en bout : la conception UI/UX de toutes les pages, de l'accueil aux pages légales, puis leur développement et l'intégration de deux API, celle des tarifs et celle de la boutique."
  highlights:
    - Conception UI/UX d'une quinzaine de pages
    - Intégration de l'API des tarifs
    - Boutique de consommables
    - Vidéo de présentation avec Remotion
approach:
  paragraphs:
    - "La cible navigue surtout sur mobile, parfois avec une connexion lente. Le site est donc généré en pages HTML statiques, qui s'affichent vite et sont bien référencées."
    - "Sur ce marché, l'achat passe souvent par une conversation. Plutôt qu'un panier, chaque produit a un bouton qui ouvre WhatsApp avec le produit déjà indiqué : une étape de moins, et un geste que les clients connaissent. Les tarifs s'affichent dans la devise du pays de l'utilisateur, pour qu'il n'ait pas à faire la conversion au moment de choisir son abonnement. Enfin, les mêmes fonds, la même typographie et les mêmes composants sont repris sur toutes les pages, pages légales comprises."
