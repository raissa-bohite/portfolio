project: yofeii-delices
locale: fr
eyebrow: Étude de cas · Mission client
title: Yofeii Délices, une boutique d'épices et son back-office
lead: 'Une marque d''assaisonnements avait besoin de vendre en ligne et de gérer sa boutique elle-même. J''ai développé le front : le site où les clients achètent, et le back-office où l''équipe gère la boutique.'
seoTitle: Yofeii Délices, e-commerce et back-office · Étude de cas
seoDescription: Boutique en ligne en Astro et React avec paiement Stripe, et back-office pour gérer le catalogue, les commandes et les clients.
meta:
  role: Développeuse front-end principale
  team: Avec un développeur backend (API Laravel)
  period: '2026'
  status: En ligne
context:
- Yofeii Délices vend des assaisonnements et des marinades. La marque voulait un site où ses clients découvrent les produits, remplissent un panier et paient en ligne.
- Elle avait aussi besoin d'un outil interne, pour ajouter un produit, suivre une commande ou changer une bannière sans passer par un développeur.
role:
  paragraphs:
  - J'ai développé le front du site et du back-office. L'API, en Laravel, était développée en parallèle par un développeur backend, avec qui je me coordonnais au fil des livraisons.
  highlights:
  - Site e-commerce
  - Back-office
  - Intégration de l'API
  - Composants réutilisables
approach:
  paragraphs:
  - Sur le site, le client parcourt le catalogue, consulte une fiche produit, remplit son panier et paie avec Stripe. Son panier reste enregistré s'il ferme la page.
  - Dans le back-office, l'équipe gère les produits, les stocks, les commandes et les clients, et change les bannières de la page d'accueil. Un tableau de bord résume les ventes.
